# Builds a signed APK and publishes it as a GitHub Release whenever a tag like v1.2 is pushed.
# The app checks the latest release and offers the update to every phone.
name: Release APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check tag matches version.properties
        run: |
          V=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::version.properties says $V but the tag is $GITHUB_REF_NAME"; exit 1
          fi

      - name: Signing key (from repository secrets)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::secret KEYSTORE_B64 is missing"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > khmerdubber.jks
          printf 'storeFile=khmerdubber.jks\nstorePassword=%s\nkeyAlias=khmerdubber\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain testReleaseUnitTest assembleRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          NOTES=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          APK="KhmerDubber-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "Khmer Dubber $GITHUB_REF_NAME" --notes "${NOTES:-Bug fixes and improvements}"
